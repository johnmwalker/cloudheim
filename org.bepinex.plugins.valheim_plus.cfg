[HotTub]

## Change false to true to enable this section.
# Setting type: Boolean
# Default value: false
enabled = false

## If set to true, the hot tub will stay at max fuel level, without consuming any fuel.
# Setting type: Boolean
# Default value: false
infiniteFuel = true

## The hot tub will fuel itself from nearby chests.
# Setting type: Boolean
# Default value: false
autoFuel = false

## This option allows the hot tub to fuel itself from chests that it doesn't share a warded area with.
## For convenience, we recommend this to be set to true.
# Setting type: Boolean
# Default value: true
ignorePrivateAreaCheck = true

## The range of the chest detection for the auto fuel feature.
## Maximum is 50
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 50
autoRange = 10

